name: release-integrity

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact tag or full commit SHA to package
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
      - name: Build archive and integrity manifest
        env:
          RELEASE_REF: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
        run: scripts/build-release.sh "$RELEASE_REF" dist
      - name: Verify manifest
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Test extracted archive
        env:
          RELEASE_REF: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          archive="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          [ -n "$archive" ]
          mkdir "$RUNNER_TEMP/release-extract"
          tar -xzf "$archive" -C "$RUNNER_TEMP/release-extract"
          root="$(find "$RUNNER_TEMP/release-extract" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          cd "$root"
          tests/test-paths.sh
          tests/test-packet-limits.sh
          tests/test-packet-delivery.sh
          tests/test-hook-delivery.sh
          python3 tests/test-packet-health.py
          python3 tests/test-recall-synonyms.py
          python3 tests/test-website.py
          python3 tests/test-supply-chain.py
          scripts/ci-install-gitleaks.sh "$RUNNER_TEMP/bin"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          mkdir "$RUNNER_TEMP/release-home"
          HOME="$RUNNER_TEMP/release-home" ./install.sh --apply --yes >/dev/null
          grep -Fqx -- "- template_commit: $RELEASE_REF" \
            "$RUNNER_TEMP/release-home/AgentMemory/PROVENANCE.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memory-spine-release-integrity
          path: dist/
          if-no-files-found: error
          retention-days: 14
